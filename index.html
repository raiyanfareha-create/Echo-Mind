<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ar Raiyan AI Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg flex flex-col h-[80vh]">
        <div class="p-4 bg-yellow-500 text-white font-bold rounded-t-lg text-center">Ar Raiyan AI Assistant</div>
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4"></div>
        <div class="p-4 border-t flex gap-2">
            <input id="user-input" type="text" class="flex-1 border p-2 rounded" placeholder="আপনার প্রশ্ন লিখুন...">
            <button onclick="sendMessage()" class="bg-yellow-600 text-white px-4 py-2 rounded">পাঠান</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();
            if (!message) return;

            chatBox.innerHTML += `<div class="text-right"><span class="bg-blue-100 p-2 rounded inline-block">${message}</span></div>`;
            input.value = '';

            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await response.json();
            chatBox.innerHTML += `<div class="text-left"><span class="bg-gray-200 p-2 rounded inline-block">${data.reply}</span></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
