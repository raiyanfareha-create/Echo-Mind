<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Mind - AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #f9f295 50%, #b8860b 100%);
        }
        .luxury-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        body {
            background-color: #faf9f6; /* Off-white background */
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-2 sm:p-4">
    <div class="w-full max-w-md bg-white rounded-2xl luxury-shadow flex flex-col h-[90vh] border border-gray-100 overflow-hidden">
        
        <div class="p-4 gold-gradient text-gray-900 font-bold text-center shadow-md">
            <h1 class="text-xl tracking-wider uppercase">Echo Mind</h1>
            <p class="text-[10px] opacity-80">Powered by Ar Raiyan Ecosystem</p>
        </div>

        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 bg-[#fdfbf7]">
            <div class="text-left">
                <span class="bg-gray-200 text-gray-800 p-3 rounded-2xl rounded-tl-none inline-block max-w-[80%] text-sm">
                    হ্যালো! আমি **Echo Mind**। আপনাকে কীভাবে সাহায্য করতে পারি?
                </span>
            </div>
        </div>

        <div class="p-4 bg-white border-t border-gray-100 flex gap-2">
            <input id="user-input" type="text" 
                class="flex-1 border border-gray-200 p-3 rounded-full outline-none focus:border-[#d4af37] transition-all text-sm" 
                placeholder="আপনার প্রশ্নটি এখানে লিখুন...">
            <button onclick="sendMessage()" 
                class="gold-gradient text-gray-900 font-bold px-6 py-2 rounded-full hover:opacity-90 transition-all shadow-md text-sm">
                পাঠান
            </button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();
            if (!message) return;

            // User Message
            chatBox.innerHTML += `
                <div class="text-right">
                    <span class="gold-gradient text-gray-900 p-3 rounded-2xl rounded-tr-none inline-block max-w-[80%] text-sm shadow-sm">
                        ${message}
                    </span>
                </div>`;
            
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();

                // Bot Message
                chatBox.innerHTML += `
                    <div class="text-left">
                        <span class="bg-gray-200 text-gray-800 p-3 rounded-2xl rounded-tl-none inline-block max-w-[80%] text-sm shadow-sm">
                            ${data.reply}
                        </span>
                    </div>`;
            } catch (error) {
                chatBox.innerHTML += `<div class="text-center text-red-400 text-xs">Error: উত্তর পাওয়া যায়নি।</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Enter key support
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
