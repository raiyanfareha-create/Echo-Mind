<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Mind - AI Assistant</title>
    <style>
        :root { --gold: #D4AF37; --dark-gold: #B8860B; --marble-bg: #fdfdfd; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; }
        
        /* Floating Bubble */
        #chat-bubble {
            position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px;
            background: linear-gradient(135deg, var(--gold), var(--dark-gold));
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.3); z-index: 9999;
            transition: transform 0.3s;
        }
        #chat-bubble:hover { transform: scale(1.1); }

        /* Chat Window */
        #chat-window {
            position: fixed; bottom: 100px; right: 25px; width: 360px; height: 520px;
            background: white; border-radius: 18px; display: none; flex-direction: column;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2); border: 1.5px solid var(--gold); overflow: hidden; z-index: 9998;
        }

        /* Header */
        .header { 
            background: #fff; border-bottom: 2px solid var(--gold); padding: 18px; 
            text-align: center; background-image: url('https://www.transparenttextures.com/patterns/marble.png');
        }
        .header h2 { margin: 0; color: var(--dark-gold); font-size: 20px; letter-spacing: 1px; }

        /* Messages */
        .messages { flex: 1; padding: 20px; overflow-y: auto; background: var(--marble-bg); display: flex; flex-direction: column; }
        .bot-msg, .user-msg { margin-bottom: 12px; padding: 12px 16px; border-radius: 15px; max-width: 80%; font-size: 14.5px; line-height: 1.5; }
        .bot-msg { background: #fff; color: #333; align-self: flex-start; border: 1px solid #eee; box-shadow: 2px 2px 5px rgba(0,0,0,0.05); }
        .user-msg { background: var(--gold); color: white; align-self: flex-end; box-shadow: -2px 2px 5px rgba(0,0,0,0.1); }

        /* Input Area */
        .input-area { display: flex; border-top: 1px solid #f0f0f0; padding: 15px; background: #fff; }
        .input-area input { flex: 1; border: none; outline: none; padding: 10px; font-size: 14px; }
        .input-area button { background: var(--gold); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="chat-bubble" onclick="toggleChat()">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </div>

    <div id="chat-window">
        <div class="header"><h2>Echo Mind</h2></div>
        <div id="msg-container" class="messages">
            <div class="bot-msg">আসসালামু আলাইকুম! <b>Echo Mind</b>-এ আপনাকে স্বাগতম। আমি কীভাবে আপনাকে সাহায্য করতে পারি?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="এখানে লিখুন..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function toggleChat() {
            const win = document.getElementById('chat-window');
            win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const container = document.getElementById('msg-container');
            container.innerHTML += `<div class="user-msg">${message}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            // API Call
            try {
                await fetch('/api/send-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
            } catch (err) { console.error("Error sending to server"); }

            setTimeout(() => {
                container.innerHTML += `<div class="bot-msg">ধন্যবাদ। আপনার বার্তাটি গ্রহণ করা হয়েছে। <b>Echo Mind</b>-এর প্রতিনিধি শীঘ্রই আপনার সাথে যোগাযোগ করবেন।</div>`;
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
